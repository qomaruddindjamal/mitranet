# ==============================================================================
# MitraNet TUI/CLI Headless Blacklist
# Disable non-server multimedia & desktop drivers to save RAM and speed up boot
# Network drivers (Ethernet, SFP, WiFi, VLAN, Bonding) are NEVER blacklisted!
# ==============================================================================

# Sound / Audio
blacklist snd
blacklist snd_pcm
blacklist snd_timer
blacklist snd_page_alloc
blacklist soundcore

# Bluetooth
blacklist bluetooth
blacklist btusb
blacklist btrtl
blacklist btbcm
blacklist btintel

# Joystick & Game controllers
blacklist joydev

# Video / Webcam / TV Tuner
blacklist uvcvideo
blacklist videodev

# FireWire
blacklist firewire-core
blacklist firewire-ohci
