# ==============================================================================
# MitraNet Enterprise Network Tuning (1G / 10G / 25G / 40G / 100Gbps Ready)
# Designed for high-throughput gateway & data center routing appliances
# ==============================================================================

# --- 1. CORE BACKLOG & QUEUEING (Cegah packet drop pada traffic burst 10G - 100G) ---
net.core.netdev_max_backlog = 500000
net.core.somaxconn = 65535

# --- 2. SOCKET MEMORY BUFFERS (Max buffer 128 MB untuk saturasi link 100GbE) ---
net.core.rmem_max = 134217728
net.core.wmem_max = 134217728
net.core.rmem_default = 33554432
net.core.wmem_default = 33554432
net.core.optmem_max = 2048576

# --- 3. TCP AUTO-TUNING BUFFERS (Min, Default, Max = 128MB) ---
net.ipv4.tcp_rmem = 4096 87380 134217728
net.ipv4.tcp_wmem = 4096 65536 134217728

# --- 4. TCP CONGESTION & PACING (BBRv1/BBRv2 + Fair Queueing) ---
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# --- 5. HIGH-SPEED TCP WINDOW SCALING & METRICS ---
net.ipv4.tcp_window_scaling = 1
net.ipv4.tcp_timestamps = 1
net.ipv4.tcp_sack = 1
net.ipv4.tcp_dsack = 1
net.ipv4.tcp_fack = 1
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_no_metrics_save = 1

# --- 6. FIREWALL & NAT CONNTRACK (Scale hingga 1.048.576 koneksi simultan) ---
net.netfilter.nf_conntrack_max = 1048576
net.netfilter.nf_conntrack_tcp_timeout_established = 600
net.netfilter.nf_conntrack_tcp_timeout_close_wait = 30
net.netfilter.nf_conntrack_tcp_timeout_fin_wait = 30
net.netfilter.nf_conntrack_tcp_timeout_time_wait = 30

# --- 7. ROUTING & IP FORWARDING ---
net.ipv4.ip_forward = 1
net.ipv4.conf.all.forwarding = 1
net.ipv6.conf.all.forwarding = 1

# --- 8. MEMORY & VFS LATENCY (Prioritaskan RAM, hindari Swap) ---
vm.swappiness = 10
vm.vfs_cache_pressure = 50
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10
