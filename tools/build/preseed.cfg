# MitraNet Rinjani 1.0.2 Preseed Automated Installation
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string mitranet
d-i netcfg/get_domain string local

d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

d-i passwd/root-login boolean true
d-i passwd/root-password password mitranet
d-i passwd/root-password-again password mitranet
d-i passwd/user-fullname string MitraNet Administrator
d-i passwd/username string admin
d-i passwd/user-password password mitranet
d-i passwd/user-password-again password mitranet

d-i clock-setup/utc boolean true
d-i time/zone string Asia/Jakarta
d-i clock-setup/ntp boolean true

d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string python3 python3-pip python3-venv python3-pydantic php-cli php-curl php-mbstring php-xml php-json iproute2 iptables nftables curl sudo rsync qemu-system-x86 qemu-utils novnc websockify
d-i pkgsel/upgrade select none
popularity-contest popularity-contest/participate boolean false

d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string default

d-i preseed/late_command string \
    in-target mkdir -p /mitranet /etc/mitranet /var/local/repository /var/lib/mitranet/isos /var/lib/mitranet/vms /etc/mitranet/vms /etc/mitranet/network /usr/share/mitranet; \
    mkdir -p /media; \
    mount /dev/sr0 /media || mount /dev/cdrom /media || mount $(blkid -t LABEL="MitraNet_1.0.2_amd64" -o device) /media || mount /dev/sdb /media || mount /dev/sdb1 /media || mount /dev/sdc /media || mount /dev/sdc1 /media || true; \
    tar -xzf /media/mitranet/mitranet.tar.gz -C /target/mitranet/ || true; \
    cp -r /media/repository/* /target/var/local/repository/ || true; \
    cp /media/mitranet/mitranet.asc /target/etc/apt/trusted.gpg.d/mitranet.asc || true; \
    umount /media || true; \
    echo 'deb [arch=all,amd64 signed-by=/etc/apt/trusted.gpg.d/mitranet.asc] file:/var/local/repository rinjani main' > /target/etc/apt/sources.list.d/mitranet-offline.list; \
    in-target apt-get update -o Dir::Etc::sourcelist="sources.list.d/mitranet-offline.list" -o Dir::Etc::sourceparts="-"; \
    in-target apt-get install -y --no-install-recommends mitranet-config-engine mitranet-network-engine mitranet-core mitranet-gateway-monitor || true; \
    cp /target/mitranet/tests/mitranet-vm-runner /target/usr/local/bin/mitranet-vm-runner || true; \
    chmod 755 /target/usr/local/bin/mitranet-vm-runner || true; \
    echo '[Unit]' > /target/etc/systemd/system/mitranet-vm@.service; \
    echo 'Description=MitraNet Virtual Machine (%i)' >> /target/etc/systemd/system/mitranet-vm@.service; \
    echo 'After=network.target' >> /target/etc/systemd/system/mitranet-vm@.service; \
    echo '[Service]' >> /target/etc/systemd/system/mitranet-vm@.service; \
    echo 'Type=simple' >> /target/etc/systemd/system/mitranet-vm@.service; \
    echo 'ExecStart=/usr/local/bin/mitranet-vm-runner %i' >> /target/etc/systemd/system/mitranet-vm@.service; \
    echo 'Restart=always' >> /target/etc/systemd/system/mitranet-vm@.service; \
    echo 'RestartSec=5' >> /target/etc/systemd/system/mitranet-vm@.service; \
    echo '[Install]' >> /target/etc/systemd/system/mitranet-vm@.service; \
    echo 'WantedBy=multi-user.target' >> /target/etc/systemd/system/mitranet-vm@.service; \
    echo '[Unit]' > /target/etc/systemd/system/mitranet-webui.service; \
    echo 'Description=MitraNet WebUI Management Layer and REST API' >> /target/etc/systemd/system/mitranet-webui.service; \
    echo 'After=network.target network-online.target mitranet-firewall.service' >> /target/etc/systemd/system/mitranet-webui.service; \
    echo 'Wants=network.target' >> /target/etc/systemd/system/mitranet-webui.service; \
    echo '[Service]' >> /target/etc/systemd/system/mitranet-webui.service; \
    echo 'Type=simple' >> /target/etc/systemd/system/mitranet-webui.service; \
    echo 'User=root' >> /target/etc/systemd/system/mitranet-webui.service; \
    echo 'Group=root' >> /target/etc/systemd/system/mitranet-webui.service; \
    echo 'WorkingDirectory=/mitranet' >> /target/etc/systemd/system/mitranet-webui.service; \
    echo 'ExecStart=/usr/bin/python3 -m mitranet.src.api.server' >> /target/etc/systemd/system/mitranet-webui.service; \
    echo 'Restart=always' >> /target/etc/systemd/system/mitranet-webui.service; \
    echo 'RestartSec=3' >> /target/etc/systemd/system/mitranet-webui.service; \
    echo 'KillMode=process' >> /target/etc/systemd/system/mitranet-webui.service; \
    echo '[Install]' >> /target/etc/systemd/system/mitranet-webui.service; \
    echo 'WantedBy=multi-user.target' >> /target/etc/systemd/system/mitranet-webui.service; \
    in-target systemctl enable mitranet-webui.service || true; \
    echo 'admin ALL=(ALL) NOPASSWD: ALL' > /target/etc/sudoers.d/admin; \
    chmod 0440 /target/etc/sudoers.d/admin; \
    echo "PermitRootLogin yes" >> /target/etc/ssh/sshd_config; \
    echo "PasswordAuthentication yes" >> /target/etc/ssh/sshd_config

d-i finish-install/reboot_in_progress note
