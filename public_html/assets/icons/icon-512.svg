<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Squircle -->
  <rect x="20" y="20" width="472" height="472" rx="110" fill="url(#bgGrad512)" />
  <rect x="20" y="20" width="472" height="472" rx="110" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.3" />

  <!-- Router Chassis Top Slot -->
  <rect x="96" y="140" width="320" height="96" rx="20" fill="#1e293b" stroke="#38bdf8" stroke-width="6" />
  <circle cx="150" cy="188" r="14" fill="#10b981" filter="url(#glow)" />
  <circle cx="196" cy="188" r="14" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="242" cy="188" r="14" fill="#6366f1" filter="url(#glow)" />
  <rect x="300" y="172" width="76" height="32" rx="8" fill="#334155" />

  <!-- Router Chassis Bottom Slot -->
  <rect x="96" y="276" width="320" height="96" rx="20" fill="#1e293b" stroke="#38bdf8" stroke-width="6" />
  <circle cx="150" cy="324" r="14" fill="#10b981" filter="url(#glow)" />
  <circle cx="196" cy="324" r="14" fill="#10b981" filter="url(#glow)" />
  <line x1="242" y1="324" x2="274" y2="324" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />
  <rect x="300" y="308" width="76" height="32" rx="8" fill="#334155" />

  <!-- Antenna / Link Indicators -->
  <path d="M256 80 L256 120 M256 392 L256 432" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
</svg>
